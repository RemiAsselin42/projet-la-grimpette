<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscriptions</title>
    <link rel="stylesheet" href="css/root.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="js/script.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="hd-logo">
        <h2>La Grimpette</h2>
      </a>
      <div class="hd-flex">
        <div class="dropdown">
          <h3 class="dropdown-toggle">
            Activités
            <i class="fa-solid fa-caret-down"></i>
          </h3>
          <div class="dropdown-menu">
            <a href="enfants.html">Enfants</a>
            <a href="ados.html">Ados</a>
            <a href="adultes.html">Adultes</a>
          </div>
        </div>
        <a href="inscrits.html"><h3>Inscrits</h3></a>
        <a href="contact.html"><h3>Contact</h3></a>
      </div>
      <div class="burger-menu">
        <div class="burger-icon">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </header>

    <div class="sliding-menu">
      <div class="menu-header">
        <h2>Menu</h2>
        <div class="close-menu">
          <i class="fas fa-times"></i>
        </div>
      </div>
      <nav>
        <a href="inscrits.html">Inscrits</a>
        <a href="enfants.html">Enfants</a>
        <a href="ados.html">Ados</a>
        <a href="adultes.html">Adultes</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>

    <main id="inscrits-main">
      <h2>Tableau des inscriptions acceptées</h2>
      <div id="filters">
        <input type="text" id="search-input" placeholder="Rechercher..." />
        <select id="activity-select">
          <option value="">Liste des activités</option>
        </select>
        <!-- <button id="sort-nom">Tri Nom</button>
        <button id="sort-prenom">Tri Prénom</button>
        <button id="sort-cours">Tri Cours</button> -->
      </div>
      <table id="inscriptions-table"></table>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-logo">
          <h2>La Grimpette</h2>
        </div>
        <div class="footer-links">
          <a href="index.html">Accueil</a>
          <a href="inscrits.html">Inscrits</a>
          <a href="enfants.html">Enfants</a>
          <a href="ados.html">Ados</a>
          <a href="adultes.html">Adultes</a>
          <a href="contact.html">Contact</a>
        </div>
        <div class="footer-social">
          <a href="https://www.facebook.com" target="_blank"
            ><img src="img/facebook-la-grimpette.png" alt="Facebook"
          /></a>
          <a href="https://www.instagram.com" target="_blank"
            ><img src="img/insta-la-grimpette.png" alt="Instagram"
          /></a>
          <a href="https://www.twitter.com" target="_blank"
            ><img src="img/x-la-grimpette.jpg" alt="Twitter"
          /></a>
        </div>
      </div>
    </footer>
    <script>
      let originalData = [];
      let currentData = [];

      function renderTable(data) {
        let html = `
          <thead>
            <tr>
              <th>
                Nom
                <button id="sort-nom">
                  <i class="fa-solid fa-sort"></i>
                </button>
              </th>
              <th>
                Prénom
                <button id="sort-prenom">
                  <i class="fa-solid fa-sort"></i>
                </button>
              </th>
              <th>
                Cours
                <button id="sort-cours">
                  <i class="fa-solid fa-sort"></i>
                </button>
              </th>
            </tr>
          </thead>
        `;
        html += "<tbody>";
        data.forEach((item) => {
          html += `
            <tr>
              <td>${item.nom_client}</td>
              <td>${item.prenom_client}</td>
              <td>${item.cours_client}</td>
            </tr>
          `;
        });
        html += "</tbody>";
        document.getElementById("inscriptions-table").innerHTML = html;

        document.getElementById("sort-nom").addEventListener("click", () => {
          currentData.sort((a, b) => a.nom_client.localeCompare(b.nom_client));
          renderTable(currentData);
        });
        document.getElementById("sort-prenom").addEventListener("click", () => {
          currentData.sort((a, b) =>
            a.prenom_client.localeCompare(b.prenom_client)
          );
          renderTable(currentData);
        });
        document.getElementById("sort-cours").addEventListener("click", () => {
          currentData.sort((a, b) =>
            a.cours_client.localeCompare(b.cours_client)
          );
          renderTable(currentData);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("../../backend/json/incriptions_valides.json")
          .then((response) => response.json())
          .then((data) => {
            originalData = data;
            currentData = data;

            const activities = [...new Set(data.map((d) => d.cours_client))];
            const select = document.getElementById("activity-select");
            activities.forEach((act) => {
              let opt = document.createElement("option");
              opt.value = act;
              opt.text = act;
              select.appendChild(opt);
            });

            renderTable(data);
          })
          .catch((err) => console.error(err));

        document
          .getElementById("search-input")
          .addEventListener("input", (e) => {
            const term = e.target.value.toLowerCase();
            currentData = originalData.filter(
              (item) =>
                item.nom_client.toLowerCase().includes(term) ||
                item.prenom_client.toLowerCase().includes(term)
            );
            filterByActivity();
          });

        document
          .getElementById("activity-select")
          .addEventListener("change", () => {
            filterByActivity();
          });

        function filterByActivity() {
          const selected = document.getElementById("activity-select").value;
          let filtered = currentData.filter(
            (item) => !selected || item.cours_client === selected
          );
          renderTable(filtered);
        }
      });
    </script>
  </body>
</html>
